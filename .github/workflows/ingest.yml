# The daily run. Scrape, classify what is new, upload, commit what was learned.
#
# This job is the only thing that can make Tier A exist. Every row on the page
# arrived in a backfill, and a backfill contains no discoveries by definition —
# a company is discovered when it appears in a run of a source that was already
# running, which cannot happen until this has run on two different days.
name: ingest

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC, 08:30 IST
  workflow_dispatch:
    inputs:
      max_cost:
        description: "Dollars this run may spend on classification"
        required: false
        # Held at zero on 14 Sep 2026 while the page after the register-label fix was
        # reviewed, and restored the same day. At zero every new company waits unclassified.
        default: "0.05"
      batch:
        description: "Classify through Message Batches (half price, answers within the hour as a rule) — for a backfill"
        type: boolean
        required: false
        default: false

# Never two at once. Two runs classifying the same new companies in parallel pay
# for them twice and then race to commit the answers.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write # to commit the classification cache back

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A batch run waits for its answers (up to UPSTREAM_BATCH_WAIT_MINUTES, then it
    # leaves the batch for the next run to collect); a nightly run has nothing to wait for.
    timeout-minutes: ${{ inputs.batch && 200 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fail here rather than three minutes of scraping later.
      - name: Check the secrets are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANTHROPIC_API_KEY INGEST_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # A present secret is not a working one — that distinction is what the run
      # of 2026-09-12 got wrong. count_tokens is free, so this costs a second and
      # nothing else, and it is spent before the three minutes of scraping.
      - name: Check the key actually works
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ingest.classify --check-key

      # `set -euo pipefail` below matters more than it looks: without pipefail,
      # `| tee` returns tee's exit code and a failed run reports success. That is
      # half of how an invalid key produced a green tick.
      - name: Scrape, classify and upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          # The ceiling matters most here, where nobody is watching: a source that
          # starts returning 5,000 rows one morning stops at a known number
          # instead of emptying the balance. Raise it for a one-off backfill by
          # dispatching the workflow by hand; the nightly run keeps the floor.
          UPSTREAM_MAX_COST: ${{ inputs.max_cost || '0.05' }}
          UPSTREAM_BATCH: ${{ inputs.batch && '1' || '0' }}
          UPSTREAM_BATCH_WAIT_MINUTES: "150"
        run: |
          set -euo pipefail
          python -m ingest.run --base-url https://rohitrao.in/upstream | tee run.log

      # Saved before the commit is attempted, so a push that fails for any reason
      # — a protected branch, a token change, a conflict — still leaves the paid
      # answers somewhere retrievable instead of dying with the runner.
      - name: Keep the paid answers whatever happens next
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classify-cache-${{ github.run_number }}
          path: |
            ingest/cache/classify.json
            ingest/cache/products.json
            ingest/cache/contacts.json
            ingest/cache/rdap.json
            ingest/cache/wayback.json
            ingest/cache/papers.json
            ingest/cache/batch_pending.json
            run.log
          retention-days: 30
          if-no-files-found: error

      # The headline on the Actions page, where it is read without opening a log.
      - name: Put the outcome at the top of the run summary
        if: always()
        run: |
          set -uo pipefail
          {
            if grep -q "RUN FAILED" run.log 2>/dev/null; then
              echo "## Ingest failed"
              echo
              echo '```'
              sed -n '/^Summary$/,$p' run.log
              echo '```'
            elif grep -qE "SOURCE (QUARANTINED|FAILED)" run.log 2>/dev/null; then
              # The healthy sources uploaded; the job is red because one did not.
              echo "## Ingest ran, but a source was set aside"
              echo
              echo '```'
              sed -n '/^Summary$/,$p' run.log
              echo '```'
            else
              echo "## Ingest"
              echo
              echo '```'
              sed -n '/^Summary$/,$p' run.log 2>/dev/null || echo "No summary: the run did not reach it."
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The cache lives in the repo because a fresh checkout has no memory. If
      # this step does not run, tomorrow re-pays for everything today learned, so
      # it fails the job rather than shrugging. BUILD's sketch ends both of these
      # lines with `|| true`; that is the failure this is written to avoid.
      #
      # if: always() because a run that died at company 800 still paid for 799
      # answers. The job stays red — the failed step decides that — but the
      # answers reach the repo instead of being re-bought tomorrow.
      - name: Commit the paid answers
        if: always()
        run: |
          set -euo pipefail
          git config user.name "upstream-ingest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Both caches, and the same rule for each: classifications place a company
          # on the map, product descriptions say what it builds, and both were paid
          # for in dollars. Leaving either behind means re-buying it tomorrow.
          paid="ingest/cache/classify.json ingest/cache/products.json"
          # And four that cost no dollars but real time: a contact line, a domain's
          # registration date, its first archived copy and a company's papers, each looked up once and refreshed
          # monthly. Not committed, every night would ask every registry again.
          paid="$paid ingest/cache/contacts.json ingest/cache/rdap.json ingest/cache/wayback.json ingest/cache/papers.json"
          # A batch the run stopped waiting for: its id, so the next run collects the
          # answers instead of paying for them twice. Removed once collected.
          if [ -f ingest/cache/batch_pending.json ] || git ls-files --error-unmatch ingest/cache/batch_pending.json >/dev/null 2>&1; then
            paid="$paid ingest/cache/batch_pending.json"
          fi

          # status, not diff: a new file (the first batch_pending.json) is untracked,
          # and diff would call that "no new answers".
          if [ -z "$(git status --porcelain -- $paid)" ]; then
            echo "No new answers this run; nothing to commit."
            exit 0
          fi

          git add -A -- $paid
          git commit -m "cache: answers from $(date -u +%Y-%m-%d)"

          # One rebase attempt, because a human may have pushed while this ran.
          # Anything past that is a real conflict and wants a person.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed $(git rev-parse --short HEAD)."
